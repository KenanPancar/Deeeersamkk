          package com.dersodak.app

          import android.Manifest
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton
          import com.google.android.material.textfield.TextInputEditText
          import java.text.DateFormat
          import java.util.Date

          class MainActivity : AppCompatActivity() {
              private val handler = Handler(Looper.getMainLooper())
              private var keywordsLoaded = false

              private val tick = object : Runnable {
                  override fun run() {
                      render()
                      handler.postDelayed(this, 2_000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  findViewById<MaterialButton>(R.id.btnAppInfo).setOnClickListener {
                      open(
                          Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                              data = Uri.fromParts("package", packageName, null)
                          },
                      )
                  }
                  findViewById<MaterialButton>(R.id.btnA11y).setOnClickListener {
                      open(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  findViewById<MaterialButton>(R.id.btnNotif).setOnClickListener { openNotifications() }
                  findViewById<MaterialButton>(R.id.btnBattery).setOnClickListener { openBattery() }
                  findViewById<MaterialButton>(R.id.btnUsage).setOnClickListener {
                      open(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                  }
                  findViewById<MaterialButton>(R.id.btnOverlay).setOnClickListener {
                      open(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName"),
                          ),
                      )
                  }
                  findViewById<MaterialButton>(R.id.btnSave).setOnClickListener { saveKeywords() }
                  findViewById<MaterialButton>(R.id.btnReset).setOnClickListener {
                      findViewById<TextInputEditText>(R.id.keywords).setText(KeywordStore.DEFAULT_KEYWORDS)
                      saveKeywords()
                  }
                  val draft = savedInstanceState?.getString(DRAFT)
                  if (draft != null) {
                      findViewById<TextInputEditText>(R.id.keywords).setText(draft)
                      keywordsLoaded = true
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  val draft = findViewById<TextInputEditText>(R.id.keywords).text?.toString()
                  outState.putString(DRAFT, draft)
              }

              override fun onStart() {
                  super.onStart()
                  handler.post(tick)
              }

              override fun onStop() {
                  handler.removeCallbacks(tick)
                  super.onStop()
              }

              private fun saveKeywords() {
                  val editor = findViewById<TextInputEditText>(R.id.keywords)
                  KeywordStore.save(this, editor.text?.toString().orEmpty())
                  keywordsLoaded = true
                  Toast.makeText(this, R.string.saved, Toast.LENGTH_SHORT).show()
              }

              private fun render() {
                  val service = findViewById<TextView>(R.id.statusService)
                  val grants = findViewById<TextView>(R.id.statusGrants)
                  val live = findViewById<TextView>(R.id.statusLive)
                  val editor = findViewById<TextInputEditText>(R.id.keywords)
                  val accessibility = PermissionChecks.accessibilityOn(this)
                  service.text = if (accessibility) {
                      "Erişilebilirlik açık. YouTube bekleniyor."
                  } else {
                      "Erişilebilirlik kapalı. Denetim çalışmaz."
                  }
                  val youtube = if (PermissionChecks.youtubeInstalled(this)) "yüklü" else "yok"
                  grants.text = listOf(
                      line("Bildirim", PermissionChecks.notificationsOn(this)),
                      line("Pil serbest", PermissionChecks.batteryIgnored(this)),
                      line("Kullanım erişimi", PermissionChecks.usageOn(this)),
                      line("Uyarı bandı", PermissionChecks.overlayOn(this)),
                      "YouTube: $youtube",
                  ).joinToString("\n")
                  val at = KeywordStore.statusAt(this)
                  val clock = if (at == 0L) {
                      ""
                  } else {
                      "\n" + DateFormat.getTimeInstance(DateFormat.MEDIUM).format(Date(at))
                  }
                  live.text = KeywordStore.status(this) + clock
                  if (!keywordsLoaded && !editor.hasFocus()) {
                      editor.setText(KeywordStore.raw(this))
                      keywordsLoaded = true
                  }
              }

              private fun line(label: String, on: Boolean): String = "$label: " + if (on) "açık" else "kapalı"

              private fun openNotifications() {
                  if (Build.VERSION.SDK_INT >= 33 && !PermissionChecks.notificationsOn(this)) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 42)
                      return
                  }
                  open(
                      Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS).apply {
                          putExtra(Settings.EXTRA_APP_PACKAGE, packageName)
                      },
                  )
              }

              private fun openBattery() {
                  val intent = if (PermissionChecks.batteryIgnored(this)) {
                      Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)
                  } else {
                      Intent(
                          Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                          Uri.parse("package:$packageName"),
                      )
                  }
                  open(intent)
              }

              private fun open(intent: Intent) {
                  try {
                      startActivity(intent)
                  } catch (_: Exception) {
                      Toast.makeText(this, R.string.settings_failed, Toast.LENGTH_LONG).show()
                  }
              }

              private companion object {
                  const val DRAFT = "keyword_draft"
              }
          }
