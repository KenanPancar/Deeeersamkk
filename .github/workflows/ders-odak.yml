          package com.dersodak.app

          import android.content.Context

          object KeywordStore {
              private const val PREFS = "ders_odak"
              private const val KEY_RAW = "keywords_raw"
              private const val KEY_STATUS = "status"
              private const val KEY_STATUS_AT = "status_at"

              const val DEFAULT_KEYWORDS =
                  "ders, matematik, geometri, trigonometri, fizik, kimya, biyoloji, tarih, coğrafya, edebiyat, türkçe, ingilizce, almanca, fransızca, felsefe, sosyoloji, psikoloji, mantık, hukuk, muhasebe, iktisat, ekonomi, anatomi, fizyoloji, programlama, algoritma, python, java, calculus, algebra, physics, chemistry, biology, grammar, lecture, lesson, tutorial, homework, exam, study with me, konu anlatım, konu anlatımı, soru çözüm, soru çözümü, çıkmış soru, yks, tyt, ayt, lgs, kpss, ales, dgs, yds, yökdil, msü, ödev, sınav, deneme, ünite, formül, teorem, ispat, türev, integral, limit, fonksiyon, olasılık, istatistik, organik, hücre, mitoz, mayoz, osmanlı, inkılap, paragraf, dil bilgisi, yazım, kamp, tekrar, özet, slayt, ders notu, çözümlü, soru bankası, khan academy, lineer cebir, diferansiyel, elektrik, manyetizma, optik, dalga, termodinamik, genetik, evrim, ekoloji, harita, şiir, roman tahlili, öğretmen, üniversite, müfredat, focus, hopital, beceri temelli, oyss, odak"

              private fun prefs(context: Context) =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun raw(context: Context): String =
                  prefs(context).getString(KEY_RAW, DEFAULT_KEYWORDS) ?: DEFAULT_KEYWORDS

              fun keywords(context: Context): List<String> = parse(raw(context))

              fun save(context: Context, raw: String) {
                  prefs(context).edit().putString(KEY_RAW, raw.trim()).apply()
              }

              fun setStatus(context: Context, text: String) {
                  prefs(context).edit()
                      .putString(KEY_STATUS, text.take(240))
                      .putLong(KEY_STATUS_AT, System.currentTimeMillis())
                      .apply()
              }

              fun status(context: Context): String =
                  prefs(context).getString(KEY_STATUS, "Henüz kontrol yok.") ?: "Henüz kontrol yok."

              fun statusAt(context: Context): Long = prefs(context).getLong(KEY_STATUS_AT, 0L)

              fun parse(raw: String): List<String> =
                  raw.split(',', '\n', ';')
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }
          }
