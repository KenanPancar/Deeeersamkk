          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Ders Odak</string>
              <string name="a11y_label">Ders Odak YouTube denetimi</string>
              <string name="a11y_description">Ders çalışırken yalnızca YouTube açıkken ekranı 5 saniyede bir okur. Ana sayfaya dokunmaz. Shorts veya uzun videonun başlığı dersle ilgili değilse geri tuşuna basar; video açık kaldıysa telefonun ana ekranına döner. YouTube kapanınca taramayı durdurur. Başka uygulamaların yazısını okumaz, internete veri göndermez.</string>
              <string name="hero">YouTube açıkken Shorts ve uzun videonun başlığına bakar. Ders değilse geri alır.</string>
              <string name="restricted_help">Android 13 ve sonrasında sideload APK için önce uygulama bilgilerinde sağ üstteki üç noktadan Kısıtlı ayarlara izin ver. Bunu yapmadan erişilebilirlik anahtarı açılmayabilir.</string>
              <string name="privacy_help">İnternet izni yok. Başlıklar telefondan çıkmaz. YouTube kapalıyken 5 saniyelik ekran taraması çalışmaz. Android, başka bir uygulamayı köksüz tamamen öldürmeye izin vermez; video kapanmazsa bir sonraki kontrol ana ekrana döner.</string>
              <string name="keywords_hint">Ders kelimeleri (virgül veya satır)</string>
              <string name="open_app_info">Uygulama bilgisi</string>
              <string name="open_a11y">Erişilebilirliği aç</string>
              <string name="open_notif">Bildirim izni</string>
              <string name="open_battery">Pil kısıtını kaldır</string>
              <string name="open_usage">Kullanım erişimi</string>
              <string name="open_overlay">Uyarı bandı izni</string>
              <string name="save">Kelimeleri kaydet</string>
              <string name="reset">Varsayılan kelimeler</string>
              <string name="saved">Kelimeler kaydedildi. Sonraki kontrolde geçerli.</string>
              <string name="settings_failed">Bu ayar ekranı açılamadı.</string>
          </resources>
          END_DERS_ODAK_FILE
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/themes.xml" << 'END_DERS_ODAK_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.DersOdak" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/green</item>
                  <item name="colorOnPrimary">@color/on_green</item>
                  <item name="colorSurface">@color/card</item>
                  <item name="android:colorBackground">@color/paper</item>
                  <item name="android:statusBarColor">@color/green_dark</item>
                  <item name="android:navigationBarColor">@color/paper</item>
                  <item name="materialButtonStyle">@style/Widget.DersOdak.Button</item>
              </style>

              <style name="Widget.DersOdak.Button" parent="Widget.Material3.Button">
                  <item name="android:textAllCaps">false</item>
                  <item name="android:minHeight">52dp</item>
                  <item name="cornerRadius">14dp</item>
              </style>

              <style name="Widget.DersOdak.Button.Quiet" parent="Widget.Material3.Button.OutlinedButton">
                  <item name="android:textAllCaps">false</item>
                  <item name="android:minHeight">52dp</item>
                  <item name="cornerRadius">14dp</item>
              </style>
          </resources>
          END_DERS_ODAK_FILE
          mkdir -p "app/src/main/res/xml"
          cat > "app/src/main/res/xml/accessibility_service_config.xml" << 'END_DERS_ODAK_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/a11y_description"
              android:isAccessibilityTool="true"
              android:notificationTimeout="100"
              android:settingsActivity="com.dersodak.app.MainActivity" />
          END_DERS_ODAK_FILE
          cat > "build.gradle.kts" << 'END_DERS_ODAK_FILE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          END_DERS_ODAK_FILE
          cat > "gradle.properties" << 'END_DERS_ODAK_FILE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.welcome=never
          END_DERS_ODAK_FILE
          cat > "settings.gradle.kts" << 'END_DERS_ODAK_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DersOdak"
          include(":app")
          END_DERS_ODAK_FILE

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK platform
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager yok"
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Derle
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: DersOdak
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
