          package com.dersodak.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.app.NotificationManager
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.util.Log
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.TextView
          import androidx.core.content.ContextCompat

          class YouTubeGuardService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var youtubeActive = false
              private var unknownStreak = 0
              private var violationStreak = 0
              private var scanQueued = false

              private val scan = Runnable {
                  scanQueued = false
                  runScan()
              }

              private val pkgWatch = object : Runnable {
                  override fun run() {
                      try {
                          val foreground = foregroundPackage()
                          when {
                              foreground == YOUTUBE -> onEnterYoutube()
                              foreground != null && !isTransient(foreground) && foreground != packageName -> onLeftYoutube()
                          }
                      } catch (error: Exception) {
                          Log.w(TAG, "paket kontrolu", error)
                      }
                      handler.postDelayed(this, 60_000)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  try {
                      val info = serviceInfo
                      if (info != null) {
                          info.eventTypes =
                              AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED or
                              AccessibilityEvent.TYPE_WINDOWS_CHANGED
                          info.feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC
                          info.flags = info.flags or
                              AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS or
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS or
                              AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS
                          info.notificationTimeout = 100
                          info.packageNames = null
                          serviceInfo = info
                      }
                  } catch (error: Exception) {
                      Log.w(TAG, "servis ayari", error)
                  }
                  Notifier.ensureChannel(this)
                  handler.removeCallbacks(pkgWatch)
                  handler.postDelayed(pkgWatch, 60_000)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  try {
                      if (event == null) return
                      val type = event.eventType
                      if (type != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                          type != AccessibilityEvent.TYPE_WINDOWS_CHANGED
                      ) {
                          return
                      }
                      val pkg = event.packageName?.toString() ?: return
                      if (pkg == YOUTUBE) {
                          onEnterYoutube()
                      } else if (type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED && !isTransient(pkg)) {
                          onLeftYoutube()
                      }
                  } catch (error: Exception) {
                      Log.w(TAG, "olay", error)
                  }
              }

              override fun onInterrupt() = Unit

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  try {
                      stopService(Intent(this, GuardForegroundService::class.java))
                  } catch (_: Exception) {
                  }
                  super.onDestroy()
              }

              private fun onEnterYoutube() {
                  if (youtubeActive) {
                      if (!scanQueued) scheduleScan()
                      return
                  }
                  youtubeActive = true
                  unknownStreak = 0
                  violationStreak = 0
                  KeywordStore.setStatus(this, "YouTube açık. Denetim başladı.")
                  try {
                      ContextCompat.startForegroundService(this, Intent(this, GuardForegroundService::class.java))
                  } catch (error: Exception) {
                      Log.w(TAG, "on plan servisi", error)
                  }
                  handler.removeCallbacks(scan)
                  scanQueued = true
                  handler.post(scan)
              }

              private fun onLeftYoutube() {
                  if (!youtubeActive) return
                  youtubeActive = false
                  unknownStreak = 0
                  violationStreak = 0
                  handler.removeCallbacks(scan)
                  scanQueued = false
                  try {
                      stopService(Intent(this, GuardForegroundService::class.java))
                  } catch (_: Exception) {
                  }
                  KeywordStore.setStatus(this, "YouTube kapalı. Tarama durdu.")
              }

              private fun runScan() {
                  if (!youtubeActive) return
                  try {
                      val power = getSystemService(PowerManager::class.java)
                      if (power != null && !power.isInteractive) {
                          unknownStreak = 0
                          KeywordStore.setStatus(this, "Ekran kapalı. Dokunulmadı.")
                          scheduleScan()
                          return
                      }
                      val root = rootInActiveWindow
                      if (root == null) {
                          scheduleScan()
                          return
                      }
                      val pkg = root.packageName?.toString()
                      if (pkg != YOUTUBE) {
                          root.recycle()
                          onLeftYoutube()
                          return
                      }
                      val nodes = ArrayList<NodeSnap>(256)
                      collect(root, nodes, 0)
                      root.recycle()
                      val judgment = ScreenJudge.judge(nodes, KeywordStore.keywords(this))
                      act(judgment)
                  } catch (error: Exception) {
                      Log.w(TAG, "tarama", error)
                  }
                  scheduleScan()
              }

              private fun scheduleScan() {
                  if (!youtubeActive || scanQueued) return
                  scanQueued = true
                  handler.postDelayed(scan, 5_000)
              }

              private fun act(judgment: Judgment) {
                  val head = when (judgment.kind) {
                      ScreenKind.HOME -> "Ana ekran"
                      ScreenKind.SHORTS -> "Shorts"
                      ScreenKind.LONG_VIDEO -> "Uzun video"
                  }
                  val titleBit = if (judgment.title.isBlank()) "" else " · ${judgment.title.take(90)}"
                  val base = head + titleBit
                  val allowed = judgment.kind == ScreenKind.HOME || (!judgment.shouldGoBack && !judgment.waitingForTitle)
                  if (allowed) {
                      unknownStreak = 0
                      violationStreak = 0
                      KeywordStore.setStatus(this, "$base · ${judgment.reason}")
                      return
                  }
                  if (judgment.waitingForTitle) {
                      unknownStreak += 1
                      if (unknownStreak >= 3) {
                          leave("$base · başlık okunamadı")
                          unknownStreak = 0
                      } else {
                          KeywordStore.setStatus(this, "$base · başlık bekleniyor")
                      }
                      return
                  }
                  unknownStreak = 0
                  leave("$base · ${judgment.reason}")
              }

              private fun leave(line: String) {
                  violationStreak += 1
                  val goHome = violationStreak >= 2
                  val acted = if (goHome) {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  } else {
                      performGlobalAction(GLOBAL_ACTION_BACK)
                  }
                  if (!acted && !goHome) performGlobalAction(GLOBAL_ACTION_HOME)
                  val action = if (goHome || !acted) "ana ekrana dönüldü" else "geri tuşu"
                  val status = "$line · $action"
                  KeywordStore.setStatus(this, status)
                  Log.i(TAG, status.take(180))
                  notify(status)
                  showBanner(if (goHome) "Ders dışı video kapatıldı" else "Ders dışı içerik, geri")
              }

              private fun notify(text: String) {
                  try {
                      val manager = getSystemService(NotificationManager::class.java) ?: return
                      manager.notify(Notifier.NOTIF_ID, Notifier.build(this, text))
                  } catch (error: Exception) {
                      Log.w(TAG, "bildirim", error)
                  }
              }

              private fun showBanner(message: String) {
                  if (!PermissionChecks.overlayOn(this)) return
                  try {
                      val windowManager = getSystemService(WindowManager::class.java) ?: return
                      val view = TextView(this).apply {
                          text = message
                          setTextColor(0xFFF4FAF6.toInt())
                          textSize = 15f
                          setPadding(48, 36, 48, 36)
                          background = GradientDrawable().apply {
                              cornerRadius = 28f
                              setColor(0xFF1E6B45.toInt())
                          }
                      }
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                          PixelFormat.TRANSLUCENT,
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          y = 96
                      }
                      windowManager.addView(view, params)
                      handler.postDelayed({
                          try {
                              windowManager.removeView(view)
                          } catch (_: Exception) {
                          }
                      }, 1600)
                  } catch (error: Exception) {
                      Log.w(TAG, "bant", error)
                  }
              }

              private fun collect(node: AccessibilityNodeInfo?, out: MutableList<NodeSnap>, depth: Int) {
                  if (node == null || depth > 16 || out.size >= 350) return
                  val rect = android.graphics.Rect()
                  node.getBoundsInScreen(rect)
                  out.add(
                      NodeSnap(
                          id = node.viewIdResourceName ?: "",
                          text = node.text?.toString()?.trim().orEmpty(),
                          desc = node.contentDescription?.toString()?.trim().orEmpty(),
                          selected = node.isSelected || node.isChecked,
                          top = rect.top,
                          bottom = rect.bottom,
                      ),
                  )
                  for (index in 0 until node.childCount) {
                      val child = node.getChild(index) ?: continue
                      collect(child, out, depth + 1)
                      child.recycle()
                  }
              }

              private fun foregroundPackage(): String? {
                  if (!PermissionChecks.usageOn(this)) return null
                  val stats = getSystemService(UsageStatsManager::class.java) ?: return null
                  val now = System.currentTimeMillis()
                  val events = stats.queryEvents(now - 12_000, now)
                  val event = UsageEvents.Event()
                  var last: String? = null
                  while (events.hasNextEvent()) {
                      events.getNextEvent(event)
                      val type = event.eventType
                      val resumed = type == UsageEvents.Event.ACTIVITY_RESUMED ||
                          type == UsageEvents.Event.MOVE_TO_FOREGROUND
                      if (resumed && !event.packageName.isNullOrBlank()) last = event.packageName
                  }
                  return last
              }

              private fun isTransient(pkg: String): Boolean {
                  return pkg == "com.android.systemui" ||
                      pkg == "android" ||
                      pkg.contains("inputmethod")
              }

              private companion object {
                  const val TAG = "DersOdak"
                  const val YOUTUBE = "com.google.android.youtube"
              }
          }
