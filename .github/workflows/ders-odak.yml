          package com.dersodak.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat

          object Notifier {
              const val CHANNEL_ID = "ders_odak_watch"
              const val NOTIF_ID = 42

              fun ensureChannel(context: Context) {
                  if (Build.VERSION.SDK_INT < 26) return
                  val manager = context.getSystemService(NotificationManager::class.java) ?: return
                  val channel = NotificationChannel(
                      CHANNEL_ID,
                      "Ders denetimi",
                      NotificationManager.IMPORTANCE_LOW,
                  ).apply {
                      description = "YouTube açıkken başlık denetimi"
                      setShowBadge(false)
                  }
                  manager.createNotificationChannel(channel)
              }

              fun build(context: Context, text: String): Notification {
                  ensureChannel(context)
                  val pending = PendingIntent.getActivity(
                      context,
                      0,
                      Intent(context, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                  )
                  return NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle("Ders Odak")
                      .setContentText(text)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(text))
                      .setContentIntent(pending)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setCategory(Notification.CATEGORY_SERVICE)
                      .build()
              }
          }
          END_DERS_ODAK_FILE
          mkdir -p "app/src/main/java/com/dersodak/app"
          cat > "app/src/main/java/com/dersodak/app/PermissionChecks.kt" << 'END_DERS_ODAK_FILE'
          package com.dersodak.app

          import android.app.AppOpsManager
          import android.app.NotificationManager
          import android.content.Context
          import android.os.Build
          import android.os.PowerManager
          import android.provider.Settings

          object PermissionChecks {
              fun accessibilityOn(context: Context): Boolean {
                  val global = Settings.Secure.getInt(
                      context.contentResolver,
                      Settings.Secure.ACCESSIBILITY_ENABLED,
                      0,
                  )
                  if (global != 1) return false
                  val enabled = Settings.Secure.getString(
                      context.contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES,
                  ) ?: return false
                  val flat = enabled.lowercase()
                  return flat.contains("youtubeguardservice")
              }

              fun usageOn(context: Context): Boolean {
                  val appOps = context.getSystemService(AppOpsManager::class.java) ?: return false
                  val mode = if (Build.VERSION.SDK_INT >= 29) {
                      appOps.unsafeCheckOpNoThrow(
                          AppOpsManager.OPSTR_GET_USAGE_STATS,
                          android.os.Process.myUid(),
                          context.packageName,
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      appOps.checkOpNoThrow(
                          AppOpsManager.OPSTR_GET_USAGE_STATS,
                          android.os.Process.myUid(),
                          context.packageName,
                      )
                  }
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              fun overlayOn(context: Context): Boolean = Settings.canDrawOverlays(context)

              fun batteryIgnored(context: Context): Boolean {
                  val power = context.getSystemService(PowerManager::class.java) ?: return false
                  return power.isIgnoringBatteryOptimizations(context.packageName)
              }

              fun notificationsOn(context: Context): Boolean {
                  val manager = context.getSystemService(NotificationManager::class.java) ?: return false
                  return manager.areNotificationsEnabled()
              }

              fun youtubeInstalled(context: Context): Boolean =
                  try {
                      context.packageManager.getPackageInfo("com.google.android.youtube", 0)
                      true
                  } catch (_: Exception) {
                      false
                  }
          }
          END_DERS_ODAK_FILE
          mkdir -p "app/src/main/java/com/dersodak/app"
          cat > "app/src/main/java/com/dersodak/app/ScreenJudge.kt" << 'END_DERS_ODAK_FILE'
          package com.dersodak.app

          import java.util.Locale

          data class NodeSnap(
              val id: String,
              val text: String,
              val desc: String,
              val selected: Boolean,
              val top: Int,
              val bottom: Int,
          )

          enum class ScreenKind {
              HOME,
              SHORTS,
              LONG_VIDEO,
          }

          data class Judgment(
              val kind: ScreenKind,
              val title: String,
              val studyRelated: Boolean,
              val shouldGoBack: Boolean,
              val waitingForTitle: Boolean,
              val reason: String,
          )

          object ScreenJudge {
              private val shortsIds = listOf(
                  "reel_player",
                  "reel_recycler",
                  "reel_watch",
                  "shorts_player",
                  "reel_main",
                  "reel_player_page",
                  "reel_play_pause",
                  "reel_next_reel",
                  "reel_prev_reel",
              )

              private val playerIds = listOf(
                  "watch_player",
                  "time_bar",
                  "scrubber",
                  "player_control",
                  "player_overlays",
                  "fullscreen_button",
              )

              private val titleIdHints = listOf(
                  "video_title",
                  "watch_title",
                  "reel_title",
                  "shorts_video_title",
                  "shorts_title",
                  "/title",
              )

              private val titleIdReject = listOf(
                  "channel",
                  "toolbar",
                  "menu",
                  "button",
                  "badge",
                  "comment",
                  "ad_",
              )

              private val chrome = listOf(
                  "ana sayfa",
                  "home",
                  "shorts",
                  "kisa videolar",
                  "subscriptions",
                  "abonelikler",
                  "library",
                  "kitaplik",
                  "you",
                  "siz",
                  "ara",
                  "search",
                  "begen",
                  "like",
                  "dislike",
                  "begenme",
                  "yorum",
                  "yorumlar",
                  "comments",
                  "paylas",
                  "share",
                  "remix",
                  "abone ol",
                  "subscribe",
                  "subscribed",
                  "geri",
                  "back",
                  "kapat",
                  "close",
                  "daha fazla",
                  "more",
                  "aciklama",
                  "description",
                  "kaydet",
                  "save",
                  "indir",
                  "download",
                  "kesfet",
                  "explore",
                  "canli",
                  "live",
                  "tam ekran",
                  "fullscreen",
                  "islem menusu",
                  "daha fazla islem",
              ).map { norm(it) }.toSet()

              private val buttonPrefixes = listOf(
                  "videoyu begen",
                  "videoyu begenme",
                  "begenmekten vazgec",
                  "kanala git",
                  "videoyu paylas",
                  "yorumlari gor",
                  "yorum yap",
                  "abone ol",
              )

              fun judge(nodes: List<NodeSnap>, keywordsRaw: List<String>): Judgment {
                  val keywords = keywordsRaw.map { norm(it) }.filter { it.length >= 3 }.distinct()
                  val kind = classify(nodes)
                  if (kind == ScreenKind.HOME) {
                      return Judgment(
                          kind = kind,
                          title = "",
                          studyRelated = false,
                          shouldGoBack = false,
                          waitingForTitle = false,
                          reason = "Ana ekran. Müdahale yok.",
                      )
                  }
                  if (isAd(nodes)) {
                      return Judgment(
                          kind = kind,
                          title = "",
                          studyRelated = false,
                          shouldGoBack = false,
                          waitingForTitle = false,
                          reason = "Reklam görünüyor, bekleniyor.",
                      )
                  }
                  val picked = pickTitle(nodes, kind)
                  if (picked.display.isBlank()) {
                      val where = if (kind == ScreenKind.SHORTS) "Shorts" else "Uzun video"
                      return Judgment(
                          kind = kind,
                          title = "",
                          studyRelated = false,
                          shouldGoBack = false,
                          waitingForTitle = true,
                          reason = "$where başlığı henüz okunamadı.",
                      )
                  }
                  val hit = keywords.firstOrNull { keywordHits(norm(picked.match), it) }
                  if (hit != null) {
                      return Judgment(
                          kind = kind,
                          title = picked.display,
                          studyRelated = true,
                          shouldGoBack = false,
                          waitingForTitle = false,
                          reason = "Ders içeriği, açık kaldı.",
                      )
                  }
                  val where = if (kind == ScreenKind.SHORTS) "Shorts" else "Uzun video"
                  return Judgment(
                      kind = kind,
                      title = picked.display,
                      studyRelated = false,
                      shouldGoBack = true,
                      waitingForTitle = false,
                      reason = "$where dersle ilgili değil.",
                  )
              }

              fun keywordHits(normalizedTitle: String, normalizedKeyword: String): Boolean {
                  if (normalizedKeyword.length < 3) return false
                  if (normalizedKeyword.contains(' ')) return normalizedTitle.contains(normalizedKeyword)
                  val pattern = "(^|[^a-z0-9])" + Regex.escape(normalizedKeyword)
                  return Regex(pattern).containsMatchIn(normalizedTitle)
              }

              private fun classify(nodes: List<NodeSnap>): ScreenKind {
                  val ids = nodes.map { it.id.lowercase(Locale.US) }
                  val player = ids.any { id -> playerIds.any { hint -> id.contains(hint) } }
                  if (player) return ScreenKind.LONG_VIDEO
                  val shortsById = ids.any { id -> shortsIds.any { hint -> id.contains(hint) } }
                  val shortsTab = nodes.any { tabSelected(it, ::isShortsLabel) }
                  if (shortsById || shortsTab) return ScreenKind.SHORTS
                  return ScreenKind.HOME
              }

              private fun tabSelected(node: NodeSnap, label: (String) -> Boolean): Boolean {
                  val labeled = label(node.text) || label(node.desc)
                  if (!labeled) return false
                  if (node.selected) return true
                  val blob = norm(node.text + " " + node.desc)
                  return blob.contains("secili") || blob.contains("selected")
              }

              private fun isShortsLabel(raw: String): Boolean {
                  val n = norm(raw)
                  if (n.isBlank() || n.length > 28) return false
                  return n == "shorts" || n == "kisa videolar" || n.startsWith("shorts ")
              }

              private fun isAd(nodes: List<NodeSnap>): Boolean {
                  val ids = nodes.map { it.id.lowercase(Locale.US) }
                  if (ids.any {
                          it.contains("skip_ad") ||
                              it.contains("ad_countdown") ||
                              it.contains("ad_overlay") ||
                              it.contains("ad_progress") ||
                              it.contains("player_learn_more")
                      }
                  ) {
                      return true
                  }
                  return nodes.any { node ->
                      val values = listOf(norm(node.text), norm(node.desc)).filter { it.isNotBlank() && it.length <= 32 }
                      values.any { value ->
                          value == "reklam" ||
                              value == "sponsored" ||
                              value == "sponsorlu" ||
                              value == "skip ad" ||
                              value == "skip ads" ||
                              value.startsWith("reklami gec") ||
                              value.startsWith("reklami atla") ||
                              value.startsWith("reklamveren")
                      }
                  }
              }

              private data class TitlePick(val display: String, val match: String)

              private fun pickTitle(nodes: List<NodeSnap>, kind: ScreenKind): TitlePick {
                  val byId = nodes.mapNotNull { node ->
                      if (!looksLikeTitleId(node.id)) return@mapNotNull null
                      val text = clean(node) ?: return@mapNotNull null
                      node to text
                  }
                  if (byId.isNotEmpty()) {
                      val main = if (kind == ScreenKind.SHORTS) {
                          byId.maxBy { it.first.top }
                      } else {
                          byId.minBy { it.first.top }
                      }
                      val channel = channelName(nodes)
                      val match = listOf(main.second, channel).filter { it.isNotBlank() }.joinToString(" ")
                      return TitlePick(main.second.take(180), match.take(240))
                  }
                  val maxBottom = nodes.maxOfOrNull { it.bottom } ?: 0
                  val shortsCutoff = (maxBottom * 42) / 100
                  val longCutoff = (maxBottom * 72) / 100
                  val texts = nodes.mapNotNull { node ->
                      val text = clean(node) ?: return@mapNotNull null
                      if (kind == ScreenKind.SHORTS && maxBottom > 0 && node.top < shortsCutoff) {
                          return@mapNotNull null
                      }
                      if (kind == ScreenKind.LONG_VIDEO && maxBottom > 0 && node.top > longCutoff) {
                          return@mapNotNull null
                      }
                      text
                  }.distinct().sortedByDescending { it.length }
                  return TitlePick(
                      display = texts.firstOrNull().orEmpty().take(180),
                      match = texts.take(2).joinToString(" ").take(240),
                  )
              }

              private fun channelName(nodes: List<NodeSnap>): String {
                  val node = nodes.firstOrNull { candidate ->
                      val id = candidate.id.lowercase(Locale.US)
                      id.contains("channel") && (id.contains("name") || id.contains("title"))
                  } ?: return ""
                  return clean(node)?.take(60).orEmpty()
              }

              private fun looksLikeTitleId(id: String): Boolean {
                  if (id.isBlank()) return false
                  val lower = id.lowercase(Locale.US)
                  if (titleIdReject.any { lower.contains(it) }) return false
                  return titleIdHints.any { lower.contains(it) }
              }

              private fun clean(node: NodeSnap): String? {
                  val raw = if (node.text.length >= 2) node.text else node.desc
                  val text = raw.trim()
                  if (isChrome(text)) return null
                  return text
              }

              private fun isChrome(raw: String): Boolean {
                  val n = norm(raw)
                  if (n.isBlank() || n.length <= 2) return true
                  if (n in chrome) return true
                  if (buttonPrefixes.any { n.startsWith(it) }) return true
                  return Regex("^[0-9][0-9., ]*(bin|mn|m|b|k)?$").matches(n)
              }

              fun norm(raw: String): String {
                  val lower = raw.lowercase(Locale.forLanguageTag("tr-TR"))
                  val folded = buildString(lower.length) {
                      for (ch in lower) {
                          append(
                              when (ch) {
                                  'ı', 'i' -> 'i'
                                  'ş' -> 's'
                                  'ğ' -> 'g'
                                  'ü' -> 'u'
                                  'ö' -> 'o'
                                  'ç' -> 'c'
                                  'â', 'á', 'à' -> 'a'
                                  else -> ch
                              },
                          )
                      }
                  }
                  return folded
                      .replace(Regex("[^a-z0-9+# ]"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
              }
          }
